pre-push:
  jobs:
    - name: check
      # Runs the exact CI gate (format:check + type-aware lint/TypeScript diagnostics + test) before every push.
      # `check` loads no env and starts no server — source scans + unit tests only.
      run: bun run check

pre-commit:
  # Validation only. Pre-commit jobs must not modify the working tree or Git index.
  jobs:
    - name: oxfmt
      run: bun run oxfmt --no-error-on-unmatched-pattern --check {staged_files}
      glob:
        - '*.cjs'
        - '*.css'
        - '*.cts'
        - '*.js'
        - '*.json'
        - '*.jsonc'
        - '*.jsx'
        - '*.mjs'
        - '*.mts'
        - '*.ts'
        - '*.tsx'

    - name: oxlint
      run: bun run oxlint --no-error-on-unmatched-pattern --type-aware {staged_files}
      glob:
        - '*.cjs'
        - '*.cts'
        - '*.js'
        - '*.jsx'
        - '*.mjs'
        - '*.mts'
        - '*.ts'
        - '*.tsx'
