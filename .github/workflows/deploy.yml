name: Deploy Sandbox Bridge
run-name: >-
  Deploy Sandbox Bridge · ${{ github.event_name == 'push'
    && 'Development + Production'
    || inputs.environment == 'development' && 'Development'
    || inputs.environment == 'production' && 'Production'
    || 'Development + Production' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - all
          - development
          - production
        default: all

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Check
        run: bun run check

  publish-image:
    name: Publish sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build sandbox image
        id: build
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "$SHORT_SHA" | cut -c1-7)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "cloudflare-sandbox-bridge:sha-${SHORT_SHA}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Push to Cloudflare Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          bunx wrangler containers push "cloudflare-sandbox-bridge:sha-${SHORT_SHA}"

  deploy:
    name: Sandbox Bridge
    needs: [check, publish-image]
    strategy:
      matrix:
        environment: ${{ github.event_name == 'push' && fromJSON('["development","production"]') || inputs.environment == 'all' && fromJSON('["development","production"]') || fromJSON(format('["{0}"]', inputs.environment)) }}
      fail-fast: false
    uses: Utilities-Studio/infra/.github/workflows/cloudflare-deploy.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      concurrency_key: sandbox-bridge-${{ matrix.environment }}
      environment: ${{ matrix.environment }}
      pre_deploy_commands: sed -i -E 's#cloudflare-sandbox-bridge:(latest|sha-[0-9a-f]+)#cloudflare-sandbox-bridge:${{ needs.publish-image.outputs.image_tag }}#g' wrangler.jsonc
      skip_build: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
