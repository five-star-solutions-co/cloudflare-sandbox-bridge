name: Deploy Sandbox Bridge
run-name: >-
  Deploy Sandbox Bridge · ${{ github.event_name == 'push'
    && 'Development'
    || inputs.environment == 'development' && 'Development'
    || inputs.environment == 'production' && 'Production'
    || 'Development + Production' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - all
          - development
          - production
        default: all

permissions:
  contents: read

jobs:
  deploy:
    name: Sandbox Bridge
    strategy:
      matrix:
        environment: ${{ github.event_name == 'push' && fromJSON('["development"]') || inputs.environment == 'all' && fromJSON('["development","production"]') || fromJSON(format('["{0}"]', inputs.environment)) }}
      fail-fast: false
    uses: Utilities-Studio/infra/.github/workflows/cloudflare-deploy.yml@main
    with:
      concurrency_key: sandbox-bridge-${{ matrix.environment }}
      environment: ${{ matrix.environment }}
      pre_deploy_commands: bun run typecheck && bun run test
      skip_build: true
      skip_sync_env: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
